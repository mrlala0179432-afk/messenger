<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Mouse Controller Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="virtual-cursor" class="cursor hidden"></div>

    <div class="main-card">
        <h1 class="title">Virtual Mouse Control</h1>
        <p class="subtitle">ব্রাউজারে ভার্চুয়াল পয়েন্টার অন/অফ করুন</p>

        <div class="toggle-container">
            <span class="status-text" id="status">OFF</span>
            <label class="switch">
                <input type="checkbox" id="cursorToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="demo-section">
            <p>পয়েন্টার টেস্টের জন্য নিচের বাটন বা ভিডিও লিংক ক্লিক করুন:</p>
            <button class="demo-btn" onclick="alert('বাটনটি সঠিকভাবে কাজ করছে!')">টেস্ট বাটন</button>
            <a href="https://www.youtube.com" target="_blank" class="demo-link">ইউটিউব ভিজিট করুন</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
